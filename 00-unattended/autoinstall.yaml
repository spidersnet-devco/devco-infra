#cloud-config
# =============================================================================
# Ubuntu Server unattended install for the MS-S1 Max ("hermes").
#
# Fill in the four placeholders (see README.md in this folder), put this
# file on a USB stick labeled CIDATA as `user-data` next to an empty `meta-data`,
# boot the Ubuntu 25.10 Server installer with that stick also plugged in, and
# answer "yes" to the one "continue with autoinstall?" prompt.
#
# ~10 minutes later the box reboots into a system that, on its own:
#   1st boot : installs base packages, writes /opt/devco/devco.env with the real
#              LAN IP, applies the Strix Halo kernel parameters, reboots
#   2nd boot : builds llama.cpp, downloads both models (~80 GB), installs the
#              llama-swap gateway and starts serving coder-accurate + coder-fast
# Progress: /opt/devco/bootstrap.log   (tail -f it over ssh)
#
# WARNING: this ERASES the first/largest disk in the machine.
# =============================================================================
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: America/Los_Angeles

  identity:
    hostname: hermes
    username: __USERNAME__             # e.g. geoff  (becomes DEVCO_USER)
    password: "__PASSWORD_HASH__"      # output of:  openssl passwd -6

  ssh:
    install-server: true
    allow-pw: false                    # key only; your PC's public key below
    authorized-keys:
      - "__SSH_PUBLIC_KEY__"           # contents of ~/.ssh/id_ed25519.pub on your PC

  # Whole 2 TB on one LVM root. This is the setting the manual install gets wrong.
  storage:
    layout:
      name: lvm
      sizing-policy: all
      match:
        size: largest

  packages:
    - git
    - curl
    - jq
    - build-essential
    - cmake
    - python3-pip
    - python3-venv
    - pipx
    - openssh-server

  updates: security

  late-commands:
    # 1. Passwordless sudo for the bootstrap (remove /etc/sudoers.d/90-devco later if you like)
    - echo '__USERNAME__ ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/90-devco
    - chmod 0440 /target/etc/sudoers.d/90-devco
    # 2. Clone this repo. The token is a fine-grained PAT with read-only Contents on
    #    spidersnet-devco/devco-infra; it is deleted from the box after the clone.
    - curtin in-target --target=/target -- bash -c 'git clone https://__REPO_TOKEN__@github.com/spidersnet-devco/devco-infra.git /home/__USERNAME__/devco-infra && git -C /home/__USERNAME__/devco-infra remote set-url origin https://github.com/spidersnet-devco/devco-infra.git && chown -R __USERNAME__:__USERNAME__ /home/__USERNAME__/devco-infra'
    # 3. Install the first-boot bootstrap service (runs as the user, needs linger)
    - curtin in-target --target=/target -- bash -c 'mkdir -p /opt/devco && chown __USERNAME__:__USERNAME__ /opt/devco && echo 0 > /opt/devco/.bootstrap-stage && chown __USERNAME__:__USERNAME__ /opt/devco/.bootstrap-stage'
    - curtin in-target --target=/target -- bash -c 'install -m 0755 /home/__USERNAME__/devco-infra/00-unattended/devco-bootstrap.sh /usr/local/sbin/devco-bootstrap.sh'
    - curtin in-target --target=/target -- bash -c 'sed "s/@@USER@@/__USERNAME__/g" /home/__USERNAME__/devco-infra/00-unattended/devco-bootstrap.service > /etc/systemd/system/devco-bootstrap.service && systemctl enable devco-bootstrap.service'
    - curtin in-target --target=/target -- bash -c 'mkdir -p /var/lib/systemd/linger && touch /var/lib/systemd/linger/__USERNAME__'
